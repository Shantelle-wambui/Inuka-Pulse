# render.yaml — Render Infrastructure-as-Code blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions:
#   1. inuka-pulse-db      — Managed PostgreSQL 15 database
#   2. inuka-pulse-backend — Spring Boot web service (Docker build)

databases:
  - name: inuka-pulse-db
    databaseName: inuka_pulse
    user: inuka
    plan: free
    region: oregon

services:
  - type: web
    name: inuka-pulse-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: inuka-pulse-backend/Dockerfile
    dockerContext: inuka-pulse-backend

    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      - key: DATABASE_URL
        fromDatabase:
          name: inuka-pulse-db
          property: jdbcConnectionString

      - key: DB_USERNAME
        fromDatabase:
          name: inuka-pulse-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: inuka-pulse-db
          property: password

      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard — never commit the real value

      # Update to your Vercel frontend URL after deploy
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000

      # ETL — R2 pull model (no push to Render, avoids Cloudflare 403)
      - key: ETL_ENABLED
        value: "true"

      - key: ETL_LIVE_BATCH_URL
        value: REPLACE_WITH_R2_PUBLIC_URL/live_batch.json

      - key: ETL_PREDICTIONS_URL
        value: REPLACE_WITH_R2_PUBLIC_URL/inuka_predictions_export.json

      - key: ETL_API_KEY
        value: REPLACE_WITH_STRONG_RANDOM_KEY
