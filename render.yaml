# render.yaml — Render Infrastructure-as-Code blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions:
#   1. inuka-pulse-db       — Managed PostgreSQL 15 database
#   2. inuka-pulse-backend  — Spring Boot web service (Docker build)
#   3. inuka-pulse-frontend — Next.js frontend (Docker build)
#
# After deploy:
#   - Set JWT_SECRET in Render dashboard (Backend → Environment)
#   - Update CORS_ALLOWED_ORIGINS with your frontend URL
#   - Update NEXT_PUBLIC_INUKA_API_URL with your backend URL
#   - Set up Cloudflare R2 and update ETL URLs

databases:
  - name: inuka-pulse-db
    databaseName: inuka_pulse
    user: inuka
    plan: free
    region: oregon

services:
  # ── Backend (Spring Boot) ─────────────────────────────────────────────────
  - type: web
    name: inuka-pulse-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: inuka-pulse-backend/Dockerfile
    dockerContext: inuka-pulse-backend
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      - key: DATABASE_URL
        fromDatabase:
          name: inuka-pulse-db
          property: jdbcConnectionString

      - key: DB_USERNAME
        fromDatabase:
          name: inuka-pulse-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: inuka-pulse-db
          property: password

      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard — never commit

      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to your frontend URL after deploy

      - key: ETL_ENABLED
        value: "false"  # enable after setting up R2

      - key: LLM_ENABLED
        value: "false"  # enable after adding GROQ_API_KEY

      - key: ETL_LIVE_BATCH_URL
        sync: false   # set to R2 URL after setup

      - key: ETL_PREDICTIONS_URL
        sync: false   # set to R2 URL after setup

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: inuka-pulse-frontend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: inuka-pulse-frontend/Dockerfile
    dockerContext: inuka-pulse-frontend

    envVars:
      - key: NEXT_PUBLIC_INUKA_API_URL
        sync: false   # set to your backend URL after deploy
