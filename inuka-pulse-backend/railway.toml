# railway.toml — Backend service configuration for Railway
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
# Health check — Railway pings this endpoint
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300

# Keep one instance running
numReplicas = 1

# Restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
