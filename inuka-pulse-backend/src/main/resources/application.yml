spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  application:
    name: inuka-pulse-backend

  # Default profile — H2 in-memory for quick local dev.
  # To run against local Postgres: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
  # On Render, SPRING_PROFILES_ACTIVE=render is injected via render.yaml — no hardcoding needed.
  datasource:
    url: jdbc:h2:mem:inuka_pulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

inuka:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: Gric/GyqJGMk3dwMleaADNDcBGQ3qfOYUmPSDnXSy6lDIfYAG7cY06WPJNJp+Yor
    expiration-ms: 86400000 # 24 hours
  etl:
    enabled: ${ETL_ENABLED:true}
    live-batch-path: ${ETL_LIVE_BATCH_PATH:../inuka-pipeline/data/warehouse/live_batch.json}
    pipeline-dir: ${ETL_PIPELINE_DIR:../inuka-pipeline} # root of the Python project (contains run_live.sh)
    api-key: ${ETL_API_KEY:}

    # ── Timing & volume ─────────────────────────────────────────────────────
    poll-interval-ms: 120000 # 2 minutes
    rows-per-cycle: 200
    frontend-refresh-ms: 125000 # 2 min 5 s

  # ── LLM narrative enhancement (optional stretch goal) ─────────────────────
  # Set GROQ_API_KEY env var to enable. If blank/missing, NarrativeService
  # falls back to the templated narrative silently — no errors, no crashes.
  # Get a free key at https://console.groq.com
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
    timeout-ms: 3000 # 3 second hard timeout — never block alert creation
    enabled: ${LLM_ENABLED:true}

---
# PostgreSQL profile — local dev only
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/inuka_pulse
    driver-class-name: org.postgresql.Driver
    username: inuka
    password: inuka

  jpa:
    hibernate:
      ddl-auto: none

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

# Render production config lives in application-render.yml
# (activated by SPRING_PROFILES_ACTIVE=render set in render.yaml)
