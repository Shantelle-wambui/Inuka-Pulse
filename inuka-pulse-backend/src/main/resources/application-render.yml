# application-render.yml
# Active when SPRING_PROFILES_ACTIVE=render (set by render.yaml).
# Overrides only the values that differ from the defaults in application.yml.

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  sql:
    init:
      mode: never

  # H2 console is dev-only — never expose in production
  h2:
    console:
      enabled: false

inuka:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  etl:
    enabled: true
    # R2 public URLs — set in Render environment variables dashboard
    live-batch-url: ${ETL_LIVE_BATCH_URL}
    predictions-url: ${ETL_PREDICTIONS_URL}
    poll-interval-ms: 120000
    rows-per-cycle: 200
    frontend-refresh-ms: 125000
    api-key: ${ETL_API_KEY:}
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
    timeout-ms: 3000
    enabled: ${LLM_ENABLED:true}
