# application-railway.yml
# Active when SPRING_PROFILES_ACTIVE=railway (set in Railway service variables)
# Uses Railway's private network for database connectivity

spring:
  datasource:
    # Railway provides DATABASE_PRIVATE_URL as: postgresql://user:pass@host:port/db
    # Spring needs JDBC format: jdbc:postgresql://user:pass@host:port/db
    url: jdbc:${DATABASE_PRIVATE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: InukaRailwayPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

inuka:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  etl:
    enabled: ${ETL_ENABLED:true}
    live-batch-url: ${ETL_LIVE_BATCH_URL:}
    predictions-url: ${ETL_PREDICTIONS_URL:}
    poll-interval-ms: 120000
    rows-per-cycle: 200
    frontend-refresh-ms: 125000
    api-key: ${ETL_API_KEY:}
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
    timeout-ms: 3000
    enabled: ${LLM_ENABLED:false}
