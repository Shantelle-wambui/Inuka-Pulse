spring:
  datasource:
    # Railway injects DATABASE_URL as postgresql://user:pass@host:port/db
    # Spring Boot JDBC needs the jdbc: prefix — we prepend it here
    url: jdbc:${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER}
    password: ${PGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

inuka:
  cors:
    # Set CORS_ALLOWED_ORIGINS in Railway env vars to your Vercel URL
    # e.g. https://inuka-pulse.vercel.app
    # Multiple origins: comma-separated, no spaces
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Must be set in Railway env vars — never commit the real secret
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours
  etl:
    enabled: true
    # R2 public URLs — set in Railway environment variables
    # e.g. https://pub-xxx.r2.dev/live_batch.json
    live-batch-url: ${ETL_LIVE_BATCH_URL}
    predictions-url: ${ETL_PREDICTIONS_URL}
    poll-interval-ms: 120000
    rows-per-cycle: 200
    frontend-refresh-ms: 125000
    api-key: ${ETL_API_KEY:}
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
    timeout-ms: 3000
    enabled: ${LLM_ENABLED:true}
