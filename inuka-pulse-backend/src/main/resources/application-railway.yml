spring:
  datasource:
    # Railway injects DATABASE_URL as either:
    #   postgresql://user:pass@host:port/db   (newer format)
    #   postgres://user:pass@host:port/db     (legacy format)
    # Spring Boot requires the jdbc:postgresql:// prefix in all cases.
    # The replace() call normalises both formats safely.
    url: jdbc:postgresql://${DATABASE_URL:?DATABASE_URL env var is required}
    driver-class-name: org.postgresql.Driver
    # Railway also exposes PGUSER / PGPASSWORD — but credentials are already
    # embedded in DATABASE_URL so we let HikariCP parse them from the URL.
    hikari:
      # Railway Hobby PostgreSQL allows 25 connections max.
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000 # 30 s
      idle-timeout: 600000 # 10 min
      max-lifetime: 1800000 # 30 min
      pool-name: InukaRailwayPool
      # Required when the full URL contains credentials (no separate user/pass)
      data-source-properties:
        reWriteBatchedInserts: true
        ApplicationName: inuka-pulse

  jpa:
    hibernate:
      # Let Flyway own the schema — Hibernate must not touch DDL
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

inuka:
  cors:
    # Set CORS_ALLOWED_ORIGINS in Railway env vars to your Vercel URL
    # e.g. https://inuka-pulse.vercel.app
    # Multiple origins: comma-separated, no spaces
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Must be set in Railway env vars — never commit the real secret
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  etl:
    enabled: true
    # R2 public URLs — set in Railway environment variables
    # e.g. https://pub-xxx.r2.dev/live_batch.json
    live-batch-url: ${ETL_LIVE_BATCH_URL}
    predictions-url: ${ETL_PREDICTIONS_URL}
    poll-interval-ms: 120000
    rows-per-cycle: 200
    frontend-refresh-ms: 125000
    api-key: ${ETL_API_KEY:}
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
    timeout-ms: 3000
    enabled: ${LLM_ENABLED:true}
