name: ETL Live Cron

# Runs every 10 minutes.
# Generates a fresh batch using the Python pipeline and uploads the output
# files to Cloudflare R2. The Railway backend polls R2 every 2 minutes and
# loads the latest batch into PostgreSQL automatically — no push to Railway,
# no Cloudflare 403 errors.
#
# Secrets required (set in GitHub → Settings → Secrets → Actions):
#   R2_ACCOUNT_ID        — Cloudflare Account ID
#   R2_ACCESS_KEY_ID     — R2 API token Access Key ID
#   R2_SECRET_ACCESS_KEY — R2 API token Secret Access Key
#   R2_BUCKET            — bucket name, e.g. inuka-pipeline

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

defaults:
  run:
    working-directory: inuka-pipeline

jobs:
  run-etl:
    name: Generate ETL Batch & Upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 8        # abort if the pipeline hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: inuka-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature engineering
        run: python -m src.inuka_features

      - name: Run ML scoring
        run: python -m src.inuka_predict --score

      - name: Run live bridge (generate live_batch.json)
        run: python -m src.inuka_live_bridge

      - name: Upload live_batch.json to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: inuka-pipeline/data/warehouse
          destination-dir: /
          output-file-url: "true"
