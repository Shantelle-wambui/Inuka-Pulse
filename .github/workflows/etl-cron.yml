name: ETL Live Cron

# Runs once daily at midnight UTC.
# Generates predictions using the Python ML pipeline and writes directly
# to Railway PostgreSQL — no intermediate storage, instant updates.
#
# Secrets required (set in GitHub → Settings → Secrets → Actions):
#   DATABASE_URL  — Railway PostgreSQL connection string
#                   e.g. postgresql://postgres:PASSWORD@HOST:PORT/railway
#   BACKEND_URL   — Railway backend URL (e.g. https://your-app.railway.app)
#   ETL_API_KEY   — (optional) API key for alert evaluation endpoint

on:
  schedule:
    - cron: "0 0 * * *"      # once daily at midnight UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

defaults:
  run:
    working-directory: inuka-pipeline

jobs:
  run-etl:
    name: Run ETL Pipeline & Write to Database
    runs-on: ubuntu-latest
    timeout-minutes: 20       # increased from 8 to handle large datasets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: inuka-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature engineering
        run: python -m src.inuka_features
        timeout-minutes: 12   # give feature engineering more time

      - name: Run ML scoring
        run: python -m src.inuka_predict --score
        timeout-minutes: 5

      - name: Run live bridge (generate batch data)
        run: python -m src.inuka_live_bridge

      - name: Write to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.db_writer
        timeout-minutes: 3

      - name: Trigger alert evaluation
        if: ${{ success() }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ETL_API_KEY: ${{ secrets.ETL_API_KEY }}
        run: |
          echo "Triggering alert evaluation at $BACKEND_URL/api/alerts/evaluate"
          
          # Build curl command with optional API key header
          CURL_CMD="curl -sf -X POST"
          if [ -n "$ETL_API_KEY" ]; then
            CURL_CMD="$CURL_CMD -H 'X-ETL-Api-Key: $ETL_API_KEY'"
          fi
          CURL_CMD="$CURL_CMD -H 'Content-Type: application/json'"
          CURL_CMD="$CURL_CMD -d '{\"minutesBack\": 60}'"
          CURL_CMD="$CURL_CMD $BACKEND_URL/api/alerts/evaluate"
          
          # Execute and capture response
          RESPONSE=$(eval $CURL_CMD) || {
            echo "Warning: Alert evaluation failed (backend may be starting up)"
            exit 0  # Don't fail the workflow if alerts fail
          }
          
          echo "Alert evaluation response: $RESPONSE"
