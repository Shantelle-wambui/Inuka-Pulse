name: CI

# Runs on every push to main/development and on all pull requests targeting main.
# Covers three jobs:
#   1. etl      — Python pipeline (inuka-pipeline/)
#   2. backend  — Spring Boot (inuka-pulse-backend/)
#   3. frontend — Next.js (inuka-pulse-frontend/)

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

jobs:
  # ── Python ETL Pipeline ────────────────────────────────────────────────────
  etl:
    name: ETL Pipeline Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inuka-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: inuka-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic Inuka data
        run: python3 src/generate_inuka_data.py

      - name: Run extended ETL (produces dashboard_metrics_export.json)
        run: python -m src.extended_etl

      - name: Run feature engineering (produces fact_beneficiary_features.parquet)
        run: python -m src.inuka_features

      - name: Train demand forecast model (produces inuka_demand_forecast_v1.pkl)
        run: python -m src.models.demand_forecast --train

      - name: Train outcome forecast model (produces inuka_outcome_forecast_v1.pkl)
        run: python -m src.models.outcome_forecast --train

      - name: Generate demand forecasts (produces demand_forecasts.json)
        run: python -m src.models.demand_forecast --predict

      - name: Generate outcome predictions (produces outcome_predictions.json)
        run: python -m src.models.outcome_forecast --predict

      - name: Generate allocation recommendations (produces allocation_recommendations.json)
        run: python -m src.models.allocation_optimizer --generate

      - name: Run ML scoring
        run: python -m src.inuka_predict --score

      - name: Run live bridge (generate live_batch.json)
        run: python -m src.inuka_live_bridge

      - name: Run all tests (models and warehouse files now exist)
        run: pytest tests/ -v

      - name: Verify output files exist
        run: |
          test -f data/warehouse/live_batch.json || (echo "live_batch.json missing" && exit 1)
          test -f data/warehouse/inuka_predictions_export.json || (echo "inuka_predictions_export.json missing" && exit 1)
          test -f models/inuka_demand_forecast_v1.pkl || (echo "demand model missing" && exit 1)
          test -f models/inuka_outcome_forecast_v1.pkl || (echo "outcome model missing" && exit 1)
          echo "Pipeline output files verified."

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inuka-pulse-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test (H2 in-memory — no external DB needed)
        run: ./mvnw verify -q

      - name: Confirm fat JAR was produced
        run: |
          ls target/inuka-pulse-backend-*.jar
          echo "JAR build verified."

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inuka-pulse-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install pnpm 9.15.0
        run: corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          # Dummy value — build must succeed even without a real backend URL.
          # Real value is injected by Vercel at deploy time.
          NEXT_PUBLIC_INUKA_API_URL: http://localhost:8080
